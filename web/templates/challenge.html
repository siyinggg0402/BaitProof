{% extends "base.html" %}
{% block title %}Can you spot the scam?{% endblock %}
{% block content %}
<div class="narrow">
  <span class="pill rise"><b>FAMILY</b> Challenge</span>
  <h1 class="rise d1">Can you spot the scam?</h1>
  <p class="lead rise d2">{{ items|length }} real-style messages. Decide which are scams and which are fine, then share your score.</p>
</div>
<section class="card rise d3 narrow" id="stage" aria-live="polite" data-cid="{{ cid }}" data-items='{{ items|tojson|forceescape }}'><button class="big" id="start">Start the challenge</button></section>
{% endblock %}
{% block scripts %}<script src="/static/challenge.js"></script>{% endblock %}
