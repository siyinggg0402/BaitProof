<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Baitproof{% endblock %}</title>
{% block meta %}{% endblock %}
<link rel="stylesheet" href="/static/style.css">
<script src="/static/boot.js"></script>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
{% set path = request.url.path %}
<header><div class="wrap"><div class="bar">
  <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--brand)"/><path d="M16 6.5 8 9.8v5.6c0 4.8 3.3 8.7 8 10.1 4.7-1.4 8-5.3 8-10.1V9.8z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="m12.5 16 2.6 2.6 4.6-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Baitproof</span></a>
  <nav aria-label="Main">
    <a href="/" {% if path == '/' or path == '/check' %}aria-current="page"{% endif %}>Check</a>
    <a href="/train" {% if path == '/train' %}aria-current="page"{% endif %}>Practice</a>
    <form method="post" action="/challenge/new"><button type="submit" class="cta">Challenge family</button></form>
  </nav>
</div></div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="wrap">We keep the <em>tricks</em> you meet, not your messages.{% if not ai %} · Offline mode: AI not configured, using built-in checks.{% endif %}</footer>
<script src="/static/app.js"></script>
<script src="/static/fx.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
