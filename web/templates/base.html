<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Baitproof{% endblock %}</title>
{% block meta %}{% endblock %}
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% set path = request.url.path %}
<header><div class="wrap">
  <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.2 5 13.1 12 15 7-1.9 12-7.8 12-15V7z" fill="var(--brand)"/><path d="m10.5 16.5 4 4 7.5-8" fill="none" stroke="var(--brand-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Baitproof</a>
  <nav aria-label="Main">
    <a href="/" {% if path == '/' or path == '/check' %}aria-current="page"{% endif %}>Check a message</a>
    <a href="/train" {% if path == '/train' %}aria-current="page"{% endif %}>Practice</a>
    <form method="post" action="/challenge/new"><button type="submit">Challenge family</button></form>
  </nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="wrap">We keep the <em>tricks</em> you meet, not your messages. {% if not ai %}<br><span>Offline mode: AI not configured, using built-in checks.</span>{% endif %}</footer>
{% block scripts %}{% endblock %}
</body>
</html>
