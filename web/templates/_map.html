<section class="card reveal" aria-labelledby="map-h">
  <h2 id="map-h">Your scam resilience</h2>
  <div class="scorebox">
    <div class="ring" role="img" aria-label="Baitproof score {{ map.score }} out of 100">
      <svg viewBox="0 0 40 40"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop class="g1" offset="0"/><stop class="g2" offset="1"/></linearGradient></defs>
        <circle class="track" cx="20" cy="20" r="15.915" pathLength="100"/><circle id="ring" class="fill" cx="20" cy="20" r="15.915" pathLength="100" stroke-dasharray="{{ map.score }} 100"/></svg>
      <strong id="score">{{ map.score }}</strong>
    </div>
    <p><b>Baitproof score.</b> It grows as you practise and fades if you stop, so a little often works best.</p>
  </div>
  <div class="filters" role="group" aria-label="Filter tricks"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="weak" aria-pressed="false">Needs work</button><button type="button" data-filter="learning" aria-pressed="false">Getting there</button><button type="button" data-filter="strong" aria-pressed="false">Strong</button></div>
  <ul class="map" id="map">
  {% for t in map.tactics %}
    <li data-level="{{ t.level }}"><span class="tname">{{ t.label }}</span>
      <span class="bars" aria-hidden="true">{% for i in range(5) %}<i class="{{ 'on' if i < t.bars }} {{ t.level }}"></i>{% endfor %}</span>
      <span class="lvl {{ t.level }}">{{ t.level_text }}</span></li>
  {% endfor %}
  </ul>
</section>
