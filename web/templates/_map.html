<section class="card" aria-labelledby="map-h">
  <h2 id="map-h">Your scam resilience</h2>
  <div class="scorebox">
    <div class="ring" role="img" aria-label="Baitproof score {{ map.score }} out of 100">
      <svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="15.915" pathLength="100"/><circle id="ring" class="fill" cx="20" cy="20" r="15.915" pathLength="100" stroke-dasharray="{{ map.score }} 100"/></svg>
      <strong id="score">{{ map.score }}</strong>
    </div>
    <p>Your <b>Baitproof score</b>. It grows as you practise and fades if you stop, so little and often works best.</p>
  </div>
  <ul class="map" id="map">
  {% for t in map.tactics %}
    <li><span class="tname">{{ t.label }}</span>
      <span class="bars" aria-hidden="true">{% for i in range(5) %}<i class="{{ 'on' if i < t.bars }} {{ t.level }}"></i>{% endfor %}</span>
      <span class="lvl {{ t.level }}">{{ t.level_text }}</span></li>
  {% endfor %}
  </ul>
</section>
