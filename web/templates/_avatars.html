<fieldset class="avatars"><legend>{{ _("Pick an avatar") }}</legend>
  {% for a in avatars %}<label class="av"><input type="radio" name="avatar" value="{{ a }}" aria-label="{{ a }}"{% if a == current or (not current and loop.first) %} checked{% endif %}><span aria-hidden="true">{{ a }}</span></label>{% endfor %}
</fieldset>
